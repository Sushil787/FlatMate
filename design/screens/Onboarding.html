<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Onboarding, create or join a Flat</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3F5A00}a:hover{color:#2A3D00}
</style>
</head>
<body>
<div style="width:390px;height:844px;box-sizing:border-box;background:#F3F3EE;color:#16181A;font-family:'DM Sans',sans-serif;display:flex;flex-direction:column;padding:72px 16px 32px;gap:16px;overflow:hidden">
<div style="display:flex;align-items:center;gap:12px;padding:0 8px">
<span style="width:44px;height:44px;border-radius:50%;background:#C8431F;color:#FFFFFF;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center">M</span>
<div style="font-size:14px;color:#55584F">Signed in as<br><strong style="color:#16181A">maya@example.com</strong></div>
</div>
<h1 style="margin:8px 8px 0;font:700 36px/1.05 'Bricolage Grotesque',sans-serif">Welcome, Maya. Let's find your Flat.</h1>
<div style="flex:1"></div>

<section style="background:#FFFFFF;border-radius:28px;padding:20px;display:flex;flex-direction:column;gap:12px">
<h2 style="margin:0;font:700 20px 'Bricolage Grotesque',sans-serif">Create a Flat</h2>
<label for="ob-name" style="font-size:13px;font-weight:600;color:#55584F">Flat name</label>
<input id="ob-name" value="Maple Street 12" style="height:56px;box-sizing:border-box;border:2px solid #16181A;border-radius:16px;padding:0 16px;font:500 16px 'DM Sans',sans-serif;color:#16181A;background:#FFFFFF;outline:3px solid #C8F169">
<div style="font-size:13px;color:#55584F">You'll be the Admin. You can invite Mates next.</div>
<a href="HomeEmpty.dc.html" style="height:56px;border-radius:28px;background:#C8F169;color:#16181A;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;text-decoration:none">Create Flat</a>
</section>

<div style="display:flex;align-items:center;gap:12px;font-size:13px;font-weight:600;color:#55584F;padding:0 8px"><span style="flex:1;height:1px;background:#DEDED6"></span>or<span style="flex:1;height:1px;background:#DEDED6"></span></div>

<section style="background:#FFFFFF;border-radius:28px;padding:20px;display:flex;flex-direction:column;gap:12px">
<h2 style="margin:0;font:700 20px 'Bricolage Grotesque',sans-serif">Join with an Invite</h2>
<label for="ob-code" style="font-size:13px;font-weight:600;color:#55584F">Invite code</label>
<div style="display:flex;gap:8px">
<input id="ob-code" placeholder="MAPLE-42" style="flex:1;min-width:0;height:56px;box-sizing:border-box;border:2px solid #DEDED6;border-radius:16px;padding:0 16px;font:600 18px 'DM Sans',sans-serif;letter-spacing:.08em;color:#16181A;background:#FFFFFF">
<button style="height:56px;padding:0 22px;border:2px solid #16181A;border-radius:28px;background:transparent;color:#16181A;font:700 16px 'DM Sans',sans-serif">Join</button>
</div>
<div style="font-size:13px;color:#55584F">Got an Invite link? Just open it and you'll land in the Flat.</div>
</section>
</div>
</body>
</html>
