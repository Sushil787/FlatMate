<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profile and settings</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3F5A00}a:hover{color:#2A3D00}
</style>
</head>
<body>
<div style="width:390px;height:844px;box-sizing:border-box;background:#F3F3EE;color:#16181A;font-family:'DM Sans',sans-serif;display:flex;flex-direction:column;gap:12px;padding:52px 16px 24px;overflow:hidden">
<header style="display:flex;align-items:center;gap:12px">
<a href="Flat.dc.html" aria-label="Back to Flat" style="width:48px;height:48px;border-radius:50%;background:#FFFFFF;color:#16181A;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></a>
<h1 style="margin:0;font:700 26px/1.1 'Bricolage Grotesque',sans-serif">Profile and settings</h1>
</header>

<section style="background:#FFFFFF;border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:12px">
<div style="display:flex;align-items:center;gap:12px"><span style="width:56px;height:56px;border-radius:50%;background:#C8431F;color:#FFFFFF;font-weight:700;font-size:22px;display:flex;align-items:center;justify-content:center">M</span><div style="flex:1"><div style="font:700 20px 'Bricolage Grotesque',sans-serif">Maya</div><div style="font-size:13px;color:#55584F">maya@example.com · Google</div></div><button style="height:44px;padding:0 14px;border:0;border-radius:22px;background:#F3F3EE;color:#16181A;font:700 14px 'DM Sans',sans-serif">Edit</button></div>
<div style="display:flex;align-items:center;justify-content:space-between"><span style="font-size:13px;font-weight:600;color:#55584F">Your colour</span>
<div style="display:flex;gap:6px">
<button aria-label="Tomato" aria-pressed="true" style="width:44px;height:44px;border:0;border-radius:50%;background:transparent;padding:0;display:flex;align-items:center;justify-content:center"><span style="width:28px;height:28px;border-radius:50%;background:#C8431F;outline:3px solid #16181A;outline-offset:2px"></span></button>
<button aria-label="Marigold" style="width:44px;height:44px;border:0;border-radius:50%;background:transparent;padding:0;display:flex;align-items:center;justify-content:center"><span style="width:28px;height:28px;border-radius:50%;background:#E0A100"></span></button>
<button aria-label="Berry" style="width:44px;height:44px;border:0;border-radius:50%;background:transparent;padding:0;display:flex;align-items:center;justify-content:center"><span style="width:28px;height:28px;border-radius:50%;background:#B8356B"></span></button>
</div></div>
<div style="font-size:12px;color:#55584F">Sky, Plum and Leaf are taken by your Mates.</div>
</section>

<section style="background:#FFFFFF;border-radius:20px;padding:10px 16px 4px">
<h2 style="margin:4px 0;font:700 17px 'Bricolage Grotesque',sans-serif">Notifications</h2>
<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:50px;border-bottom:1px solid #DEDED6;font-size:15px;font-weight:600">My Turn starts<span role="switch" aria-checked="true" style="width:52px;height:32px;border-radius:16px;background:#16181A;display:flex;align-items:center;justify-content:flex-end;padding:3px;box-sizing:border-box;flex:none"><span style="width:26px;height:26px;border-radius:50%;background:#C8F169"></span></span></div>
<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:50px;border-bottom:1px solid #DEDED6;font-size:15px;font-weight:600">Reminder 3 hours before my Turn ends<span role="switch" aria-checked="true" style="width:52px;height:32px;border-radius:16px;background:#16181A;display:flex;align-items:center;justify-content:flex-end;padding:3px;box-sizing:border-box;flex:none"><span style="width:26px;height:26px;border-radius:50%;background:#C8F169"></span></span></div>
<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:50px;border-bottom:1px solid #DEDED6;font-size:15px;font-weight:600">A Turn was Missed<span role="switch" aria-checked="false" style="width:52px;height:32px;border-radius:16px;background:#C9C9C0;display:flex;align-items:center;padding:3px;box-sizing:border-box;flex:none"><span style="width:26px;height:26px;border-radius:50%;background:#FFFFFF"></span></span></div>
<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:50px;border-bottom:1px solid #DEDED6;font-size:15px;font-weight:600">New Notice<span role="switch" aria-checked="true" style="width:52px;height:32px;border-radius:16px;background:#16181A;display:flex;align-items:center;justify-content:flex-end;padding:3px;box-sizing:border-box;flex:none"><span style="width:26px;height:26px;border-radius:50%;background:#C8F169"></span></span></div>
<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:50px;font-size:15px;font-weight:600">Added to a Rotation<span role="switch" aria-checked="true" style="width:52px;height:32px;border-radius:16px;background:#16181A;display:flex;align-items:center;justify-content:flex-end;padding:3px;box-sizing:border-box;flex:none"><span style="width:26px;height:26px;border-radius:50%;background:#C8F169"></span></span></div>
</section>

<section style="background:#FFFFFF;border-radius:20px;padding:12px 16px;display:flex;flex-direction:column;gap:10px">
<h2 style="margin:0;font:700 17px 'Bricolage Grotesque',sans-serif">Appearance</h2>
<div style="display:flex;background:#F3F3EE;border-radius:24px;padding:4px">
<button aria-pressed="true" style="flex:1;height:40px;border:0;border-radius:20px;background:#16181A;color:#FFFFFF;font:700 14px 'DM Sans',sans-serif">System</button>
<button style="flex:1;height:40px;border:0;border-radius:20px;background:transparent;color:#16181A;font:600 14px 'DM Sans',sans-serif">Light</button>
<button style="flex:1;height:40px;border:0;border-radius:20px;background:transparent;color:#16181A;font:600 14px 'DM Sans',sans-serif">Dark</button>
</div>
<div style="font-size:13px;color:#55584F">Text size follows your phone's setting.</div>
</section>

<div style="flex:1"></div>
<button style="height:52px;border:2px solid #16181A;border-radius:26px;background:transparent;color:#16181A;font:700 16px 'DM Sans',sans-serif">Sign out</button>
</div>
</body>
</html>
