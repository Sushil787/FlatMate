<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Groceries, empty list</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3F5A00}a:hover{color:#2A3D00}
</style>
</head>
<body>
<div style="width:390px;height:844px;box-sizing:border-box;background:#F3F3EE;color:#16181A;font-family:'DM Sans',sans-serif;display:flex;flex-direction:column;overflow:hidden">
<div style="flex:1;display:flex;flex-direction:column;gap:16px;padding:56px 16px 0">
<header style="display:flex;align-items:baseline;justify-content:space-between">
<h1 style="margin:0;font:700 30px/1.1 'Bricolage Grotesque',sans-serif">Groceries</h1>
<span style="font-size:14px;font-weight:600;color:#55584F">0 open</span>
</header>
<div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:0 8px">
<svg width="96" height="96" viewBox="0 0 96 96" fill="none" stroke="#16181A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><circle cx="48" cy="48" r="44" fill="#E9F7C6" stroke="none"/><path d="M24 42h48l-5 30H29z" fill="#FFFFFF"/><path d="M36 42l12-18 12 18"/><path d="M40 52v10M48 52v10M56 52v10"/></svg>
<h2 style="margin:0;font:700 30px/1.05 'Bricolage Grotesque',sans-serif">The list is empty. The fridge is not our problem yet.</h2>
<p style="margin:0;font-size:16px;line-height:1.4;color:#55584F">Add the first Grocery item. Every Mate sees it straight away and anyone can tick it off.</p>
</div>
<div style="display:flex;flex-direction:column;gap:8px">
<span style="font-size:13px;font-weight:600;color:#55584F;padding:0 4px">Quick add</span>
<div style="display:flex;flex-wrap:wrap;gap:8px">
<button style="height:44px;padding:0 16px;border:0;border-radius:22px;background:#FFFFFF;color:#16181A;font:600 14px 'DM Sans',sans-serif">+ Milk</button>
<button style="height:44px;padding:0 16px;border:0;border-radius:22px;background:#FFFFFF;color:#16181A;font:600 14px 'DM Sans',sans-serif">+ Bread</button>
<button style="height:44px;padding:0 16px;border:0;border-radius:22px;background:#FFFFFF;color:#16181A;font:600 14px 'DM Sans',sans-serif">+ Eggs</button>
<button style="height:44px;padding:0 16px;border:0;border-radius:22px;background:#FFFFFF;color:#16181A;font:600 14px 'DM Sans',sans-serif">+ Toilet roll</button>
</div>
</div>
</div>

<form style="display:flex;gap:8px;align-items:center;padding:10px 16px;background:#F3F3EE">
<label for="ge-add" style="position:absolute;left:-9999px">Add a Grocery item</label>
<input id="ge-add" placeholder="Add a Grocery item…" style="flex:1;min-width:0;height:56px;box-sizing:border-box;border:2px solid #16181A;border-radius:28px;padding:0 20px;font:500 16px 'DM Sans',sans-serif;color:#16181A;background:#FFFFFF;outline:3px solid #C8F169">
<button type="button" aria-label="Add item" style="width:56px;height:56px;border:0;border-radius:50%;background:#C8F169;color:#16181A;display:flex;align-items:center;justify-content:center;flex:none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
</form>

<nav style="display:flex;margin:0 16px 22px;padding:6px;background:#FFFFFF;border:1px solid #DEDED6;border-radius:36px;box-shadow:0 8px 24px rgba(22,24,26,.14)">
<a href="Main.dc.html" aria-label="Home" style="flex:1;display:flex;align-items:center;justify-content:center;height:48px;border-radius:24px;color:#55584F;text-decoration:none"><span style="height:24px;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span></a>
<a href="Chores.dc.html" aria-label="Chores" style="flex:1;display:flex;align-items:center;justify-content:center;height:48px;border-radius:24px;color:#55584F;text-decoration:none"><span style="height:24px;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg></span></a>
<a href="Calendar.dc.html" aria-label="Calendar" style="flex:1;display:flex;align-items:center;justify-content:center;height:48px;border-radius:24px;color:#55584F;text-decoration:none"><span style="height:24px;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v3"/><path d="M16 2v3"/><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/></svg></span></a>
<a href="Groceries.dc.html" style="flex:none;display:flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 18px;border-radius:24px;background:#C8F169;color:#16181A;font-weight:700;font-size:14px;text-decoration:none"><span style="height:24px;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 11-1 9"/><path d="m19 11-4-7"/><path d="M2 11h20"/><path d="m3.5 11 1.6 7.4a2 2 0 0 0 2 1.6h9.8a2 2 0 0 0 2-1.6l1.7-7.4"/><path d="M4.5 15.5h15"/><path d="m5 11 4-7"/><path d="m9 11 1 9"/></svg></span>Groceries</a>
<a href="Flat.dc.html" aria-label="Flat" style="flex:1;display:flex;align-items:center;justify-content:center;height:48px;border-radius:24px;color:#55584F;text-decoration:none"><span style="height:24px;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><path d="M16 3.128a4 4 0 0 1 0 7.744"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><circle cx="9" cy="7" r="4"/></svg></span></a>

</div>
