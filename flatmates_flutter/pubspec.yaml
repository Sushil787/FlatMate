name: flatmates_flutter
description: Flatmates app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '^3.8.0'
  flutter: '^3.32.0'

resolution: workspace

dependencies:
  cupertino_icons: ^2.0.0
  flutter:
    sdk: flutter
  flatmates_client:
    path: ../flatmates_client
  serverpod_flutter: ^4.0.3
  serverpod_auth_idp_flutter: ^4.0.3
  intl: ^0.20.2
  table_calendar: ^3.2.1
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_riverpod: ^3.4.3
  auto_route: ^11.2.0
  riverpod_annotation: ^4.0.7
  flutter_timezone: ^5.1.1
  heroine: ^0.7.2
  motor: ^1.1.0

dev_dependencies:
  auto_route_generator: ^10.0.0
  build_runner: ^2.5.0
  flutter_lints: '>=3.0.0 <7.0.0'
  flutter_test:
    sdk: flutter
  riverpod_generator: ^4.0.9

flutter:
  uses-material-design: true
  assets:
    - assets/config.json

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-400.ttf
        - asset: assets/fonts/PlusJakartaSans-500.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-600.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-700.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-800.ttf
          weight: 800
dependency_overrides:
  flutter_secure_storage: ^10.0.0
