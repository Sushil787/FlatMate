name: flatmates_flutter
description: Flatmates app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '^3.8.0'
  flutter: '^3.32.0'

resolution: workspace

dependencies:
  cupertino_icons: ^2.0.0
  flutter:
    sdk: flutter
  flatmates_client:
    path: ../flatmates_client
  flatmates_shared:
    path: ../flatmates_shared
  serverpod_flutter: ^4.0.3
  serverpod_database: ^4.0.3
  path_provider: ^2.1.5
  serverpod_auth_idp_flutter: ^4.0.3
  intl: ^0.20.2
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_riverpod: ^3.4.3
  auto_route: ^11.2.0
  flutter_timezone: ^5.1.1
  motor: ^1.0.0-dev.5
  stupid_simple_sheet: ^0.9.1
  shared_preferences: ^2.5.6
  hugeicons: ^1.2.0
  share_plus: ^13.3.1
dev_dependencies:
  auto_route_generator: ^10.0.0
  build_runner: ^2.5.0
  flutter_lints: '>=3.0.0 <7.0.0'
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/config.json

  fonts:
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-700.ttf
          weight: 700
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-400.ttf
        - asset: assets/fonts/DMSans-500.ttf
          weight: 500
        - asset: assets/fonts/DMSans-600.ttf
          weight: 600
        - asset: assets/fonts/DMSans-700.ttf
          weight: 700
dependency_overrides:
  flutter_secure_storage: ^10.0.0
