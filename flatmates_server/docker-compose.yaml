services:
  # Development services
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: flatmates
      POSTGRES_PASSWORD: "8rFwzj9rQ8DHp_qlKGT5Zyz0xkw1Nf-1"
    volumes:
      - flatmates_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "xF8YobeWMxlPxKJaMPRenAXhH_CvJs-u"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: pgvector/pgvector:pg16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: flatmates_test
      POSTGRES_PASSWORD: "i7oNuD7d8CBhb8NwBnpSSjm31hpSDW9J"
    volumes:
      - flatmates_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "oGdSeDXBRlzQZQ6wzHDTRCGAuYYlVvf3"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  flatmates_data:
  flatmates_test_data:
