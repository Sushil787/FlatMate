name: flatmates_server
description: Starting point for a Serverpod server.
# version: 1.0.0
# homepage: https://www.example.com

environment:
  sdk: '^3.8.0'

resolution: workspace

dependencies:
  flatmates_shared:
    path: ../flatmates_shared
  googleapis_auth: ^2.0.0
  http: ^1.6.0
  serverpod: ^4.0.3
  serverpod_auth_idp_server: ^4.0.3
  timezone: ^0.11.1

dev_dependencies:
  lints: '>=3.0.0 <7.0.0'
  serverpod_test: ^4.0.3
  test: ^1.25.5

serverpod:
  flutter_apps:
    flatmates:
      path: ../flatmates_flutter
      auto_launch: true
      device: RZCW82QLD8M
      dart-define: SERVER_URL=http://192.168.1.11:8080/

  scripts:
    # Starts the server and applies migrations
    start: dart bin/main.dart --apply-migrations

    # Runs the app on the phone against the Serverpod Cloud deployment.
    app_cloud: cd ../flatmates_flutter && flutter run -d 112bc353 --dart-define=SERVER_URL=https://flatmates.api.serverpod.space/

    # Build the Flutter web app and copy it to the server's web directory.
    # Windows uses xcopy since flutter's --output flag doesn't work there.
    # See: https://github.com/flutter/flutter/issues/157886
    flutter_build:
      windows: >-
        (if exist web\app rmdir /S /Q web\app)
        & cd /D ..\flatmates_flutter
        && flutter build web --base-href /app/ --wasm
        && xcopy /E /I /Y build\web ..\flatmates_server\web\app
      posix: |
        cd ../flatmates_flutter
        flutter build web --base-href /app/ --wasm --output ../flatmates_server/web/app
