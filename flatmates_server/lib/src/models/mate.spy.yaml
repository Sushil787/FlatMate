### A member of a Flat. A Mate with [leftAt] set has left the Flat.
class: Mate
table: mate
database: all
fields:
  id: UuidValue?, defaultPersist=random_v7
  flatId: UuidValue
  authUserId: UuidValue
  displayName: String
  joinedAt: DateTime
  leftAt: DateTime?
  color: MateColor, default=tomato
  ### Which push notifications the Mate wants.
  notifyTurnStarts: bool, default=true
  notifyReminder: bool, default=true
  ### The evening push about other Mates' Turns not Done yet.
  notifyMatesNotDone: bool, default=true
  notifyNotice: bool, default=true
  notifyAddedToRotation: bool, default=true
  ### The 22:00 summary of the day: who did what, what's still open.
  notifyNightSummary: bool, default=true
  ### False until the Admin has seen that this Mate joined and picked their
  ### Chores (or chose to do it later).
  welcomed: bool, default=true
  ### When the Mate finished the practice run after joining or creating the
  ### Flat; null until then, so the app shows it again.
  onboardedAt: DateTime?
  createdAt: DateTime, default=now
  updatedAt: DateTime, default=now
indexes:
  mate_auth_user_idx:
    fields: authUserId
  mate_flat_idx:
    fields: flatId
