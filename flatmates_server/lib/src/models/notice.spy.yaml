### A text post on the Flat's notice board.
class: Notice
table: notice
fields:
  flatId: int
  mateId: int
  text: String
  pinned: bool
  ### Mates who said "Got it"; filled in by list().
  gotItMateIds: List<int>?, !persist
  createdAt: DateTime, default=now
  updatedAt: DateTime, default=now
indexes:
  notice_flat_idx:
    fields: flatId
