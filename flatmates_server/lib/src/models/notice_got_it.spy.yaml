### A Mate saying "Got it" on a Notice: they've read it.
class: NoticeGotIt
table: notice_got_it
fields:
  id: UuidValue?, defaultPersist=random_v7
  noticeId: UuidValue
  mateId: UuidValue
  createdAt: DateTime, default=now
indexes:
  notice_got_it_idx:
    fields: noticeId, mateId
    unique: true
