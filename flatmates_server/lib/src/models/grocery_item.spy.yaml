### Something on the Flat's shared grocery list.
class: GroceryItem
table: grocery_item
fields:
  flatId: int
  name: String
  note: String?
  addedByMateId: int
  boughtByMateId: int?
  boughtAt: DateTime?
  createdAt: DateTime, default=now
  updatedAt: DateTime, default=now
indexes:
  grocery_item_flat_idx:
    fields: flatId
