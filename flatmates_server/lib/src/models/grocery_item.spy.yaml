### Something on the Flat's shared grocery list.
class: GroceryItem
table: grocery_item
database: all
fields:
  id: UuidValue?, defaultPersist=random_v7
  flatId: UuidValue
  name: String
  note: String?
  addedByMateId: UuidValue
  boughtByMateId: UuidValue?
  boughtAt: DateTime?
  createdAt: DateTime, default=now
  updatedAt: DateTime, default=now
indexes:
  grocery_item_flat_idx:
    fields: flatId
