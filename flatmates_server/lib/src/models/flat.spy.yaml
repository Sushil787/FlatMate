### The shared home; the boundary for everything else.
class: Flat
table: flat
database: all
fields:
  id: UuidValue?, defaultPersist=random_v7
  name: String
  ### IANA name, e.g. Asia/Kathmandu: when the Flat's days start and end.
  timezone: String
  adminMateId: UuidValue?
  inviteCode: String
  ### When [inviteCode] stops working; 7 days after it was made.
  inviteExpiresAt: DateTime
  awayRule: AwayRule
  createdAt: DateTime, default=now
  updatedAt: DateTime, default=now
indexes:
  flat_invite_code_idx:
    fields: inviteCode
    unique: true
