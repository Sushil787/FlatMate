### An FCM registration token for one of a user's devices.
class: DeviceToken
table: device_token
fields:
  authUserId: UuidValue
  token: String
  createdAt: DateTime, default=now
  updatedAt: DateTime, default=now
indexes:
  device_token_token_idx:
    fields: token
    unique: true
  device_token_user_idx:
    fields: authUserId
