<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-label="Away rules: with Swap the next Mate covers and is paid back, with Skip the next Mate covers and nothing is owed, with Pause the Chore waits.">
<title>Away rules: with Swap the next Mate covers and is paid back, with Skip the next Mate covers and nothing is owed, with Pause the Chore waits.</title>
<style>
  text { font-family: -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif; }
  .flow { stroke-dasharray: 6 8; animation: flow 0.9s linear infinite; }
  .flow-back { stroke-dasharray: 6 8; animation: flow 0.9s linear infinite reverse; }
  @keyframes flow { to { stroke-dashoffset: -14; } }
  .pulse { animation: pulse 1.8s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.35; } }
  @media (prefers-reduced-motion: reduce) { .flow, .flow-back, .pulse, .tick { animation: none; } }
</style>
