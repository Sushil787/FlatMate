<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-label="Architecture: the Flutter app calls Serverpod endpoints by typed RPC, changes stream back live, FutureCalls send pushes via FCM, data lives in Postgres.">
<title>Architecture: the Flutter app calls Serverpod endpoints by typed RPC, changes stream back live, FutureCalls send pushes via FCM, data lives in Postgres.</title>
<style>
  text { font-family: -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif; }
  .flow { stroke-dasharray: 6 8; animation: flow 0.9s linear infinite; }
  .flow-back { stroke-dasharray: 6 8; animation: flow 0.9s linear infinite reverse; }
  @keyframes flow { to { stroke-dashoffset: -14; } }
  .pulse { animation: pulse 1.8s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.35; } }
  @media (prefers-reduced-motion: reduce) { .flow, .flow-back, .pulse, .tick { animation: none; } }
</style>
<defs>
  <clipPath id="card"><rect width="960" height="430" rx="24"/></clipPath>
  <marker id="ah-lime" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#C8F169"/></marker>
  <marker id="ah-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#B5CFEA"/></marker>
  <marker id="ah-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#E0A100"/></marker>
  <marker id="ah-soft" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A9ACA2"/></marker>
</defs>
<g clip-path="url(#card)">
<rect width="960" height="430" fill="#16181A"/>

<text x="32" y="46" font-size="20" font-weight="700" fill="#F3F3EE">How Flatmates is wired</text>
<text x="32" y="70" font-size="13" fill="#A9ACA2">Dart on both sides. Serverpod generates the client, so the app calls the server like a local library.</text>

<rect x="32" y="96" width="250" height="250" rx="16" fill="#1E201E" stroke="#3A3D38"/>
<text x="50" y="124" font-size="15" font-weight="700" fill="#F3F3EE">Flutter app</text>
<text x="264" y="124" font-size="11" fill="#A9ACA2" text-anchor="end">iOS · Android · web</text>
<rect x="46" y="140" width="222" height="40" rx="10" fill="#2A2D29"/><text x="60" y="165" font-size="13" fill="#F3F3EE">presentation · screens</text><rect x="46" y="190" width="222" height="40" rx="10" fill="#2A2D29"/><text x="60" y="215" font-size="13" fill="#F3F3EE">application · Riverpod</text><rect x="46" y="240" width="222" height="40" rx="10" fill="#323A1C" class="pulse"/><text x="60" y="265" font-size="13" fill="#E0F7A8">flatSync ◂ live changes</text><rect x="46" y="290" width="222" height="40" rx="10" fill="#2A2D29"/><text x="60" y="315" font-size="13" fill="#F3F3EE">data · repositories</text>

<rect x="400" y="96" width="300" height="250" rx="16" fill="#1E201E" stroke="#3A3D38"/>
<text x="418" y="124" font-size="15" font-weight="700" fill="#F3F3EE">Serverpod server</text>
<text x="682" y="124" font-size="11" fill="#A9ACA2" text-anchor="end">Serverpod Cloud</text>
<rect x="414" y="140" width="272" height="40" rx="10" fill="#2A2D29"/><text x="428" y="165" font-size="13" fill="#F3F3EE">FutureCalls · Turn start / end</text><rect x="414" y="190" width="272" height="40" rx="10" fill="#2A2D29"/><text x="428" y="215" font-size="13" fill="#F3F3EE">ORM · type-safe queries</text><rect x="414" y="240" width="272" height="40" rx="10" fill="#323A1C" class="pulse"/><text x="428" y="265" font-size="13" fill="#E0F7A8">broadcast() → flat-&lt;id&gt;</text><rect x="414" y="290" width="272" height="40" rx="10" fill="#2A2D29"/><text x="428" y="315" font-size="13" fill="#F3F3EE">endpoints · requireMate()</text>
<g transform="translate(662 160)">
  <circle r="10" fill="none" stroke="#C8F169" stroke-width="2"/>
  <line x1="0" y1="0" x2="0" y2="-6" stroke="#C8F169" stroke-width="2" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3s" repeatCount="indefinite"/>
  </line>
</g>

<!-- app → server: typed RPC -->
<text x="341" y="300" font-size="11" fill="#A9ACA2" text-anchor="middle">typed RPC</text>
<path d="M284 312 L394 312" stroke="#C8F169" stroke-width="2.5" fill="none" class="flow" marker-end="url(#ah-lime)"/>
<circle r="4.5" fill="#C8F169"><animateMotion dur="1.6s" begin="0s" repeatCount="indefinite" path="M284 312 L394 312"/></circle>
<!-- server → app: live stream -->
<text x="341" y="250" font-size="11" fill="#A9ACA2" text-anchor="middle">live stream</text>
<path d="M398 262 L288 262" stroke="#B5CFEA" stroke-width="2.5" fill="none" class="flow" marker-end="url(#ah-blue)"/>
<circle r="4.5" fill="#B5CFEA"><animateMotion dur="1.6s" begin="0.8s" repeatCount="indefinite" path="M398 262 L288 262"/></circle>

<!-- FCM -->
<rect x="796" y="108" width="132" height="84" rx="16" fill="#1E201E" stroke="#3A3D38"/>
<path d="M820 152 a10 10 0 0 1 20 0 v8 l4 5 h-28 l4 -5 z" fill="#E0A100" class="pulse"/>
<circle cx="830" cy="169" r="3" fill="#E0A100"/>
<text x="852" y="146" font-size="13" font-weight="700" fill="#F3F3EE">FCM</text>
<text x="852" y="163" font-size="11" fill="#A9ACA2">pushes</text>
<text x="812" y="183" font-size="10.5" fill="#A9ACA2">morning + evening</text>
<path d="M702 160 C 750 160, 750 150, 790 150" stroke="#E0A100" stroke-width="2.5" fill="none" class="flow" marker-end="url(#ah-gold)"/>
<circle r="4.5" fill="#E0A100"><animateMotion dur="2.2s" begin="0.4s" repeatCount="indefinite" path="M702 160 C 750 160, 750 150, 790 150"/></circle>

<!-- Postgres -->
<rect x="796" y="226" width="132" height="120" rx="16" fill="#1E201E" stroke="#3A3D38"/>
<g transform="translate(862 258)">
  <path d="M-22 -8 v26 a22 7 0 0 0 44 0 v-26" fill="#2A2D29" stroke="#A9ACA2" stroke-width="1.5"/>
  <ellipse cx="0" cy="-8" rx="22" ry="7" fill="#2A2D29" stroke="#A9ACA2" stroke-width="1.5"/>
  <path d="M-22 5 a22 7 0 0 0 44 0" fill="none" stroke="#A9ACA2" stroke-width="1.5"/>
</g>
<text x="862" y="312" font-size="13" font-weight="700" fill="#F3F3EE" text-anchor="middle">Postgres</text>
<text x="862" y="329" font-size="10.5" fill="#A9ACA2" text-anchor="middle">tables · FutureCalls</text>
<path d="M702 210 C 750 210, 750 262, 790 262" stroke="#A9ACA2" stroke-width="2" fill="none" class="flow" marker-end="url(#ah-soft)"/>
<circle r="4" fill="#A9ACA2"><animateMotion dur="1.9s" begin="0.2s" repeatCount="indefinite" path="M702 210 C 750 210, 750 262, 790 262"/></circle>
<text x="748" y="230" font-size="11" fill="#A9ACA2" text-anchor="middle">SQL</text>
<text x="748" y="146" font-size="11" fill="#A9ACA2" text-anchor="middle">push</text>

<!-- legend -->
<g font-size="12" fill="#A9ACA2">
  <line x1="32" y1="384" x2="58" y2="384" stroke="#C8F169" stroke-width="3"/><text x="66" y="388">app calls the server</text>
  <line x1="222" y1="384" x2="248" y2="384" stroke="#B5CFEA" stroke-width="3"/><text x="256" y="388">changes stream to every open phone</text>
  <line x1="490" y1="384" x2="516" y2="384" stroke="#E0A100" stroke-width="3"/><text x="524" y="388">Turn summaries as push notifications</text>
  <line x1="760" y1="384" x2="786" y2="384" stroke="#A9ACA2" stroke-width="3"/><text x="794" y="388">stored in Postgres</text>
</g>
<text x="32" y="412" font-size="11" fill="#A9ACA2">Every endpoint: requireMate() → query scoped to the Flat → fail('…') or save → broadcast(kind)</text>

</g>
</svg>
