  .t2 { animation: right2 38.5s linear infinite; }
  @keyframes left1 { from { transform: translateX(0); } to { transform: translateX(-1993px); } }
  @keyframes right2 { from { transform: translateX(-1347px); } to { transform: translateX(0); } }
  .bob { animation: bob 2.4s ease-in-out infinite; }
